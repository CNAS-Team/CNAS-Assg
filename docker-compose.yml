version: '3.8'
services:
  web:
    build: ./php-app
    ports:
      - "8080:80"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: mydb
      DB_PORT: 3306
    depends_on:
      - mysql
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: mydb
    volumes:
      - ./db/users.sql:/docker-entrypoint-initdb.d/users.sql
      - db-data:/var/lib/mysql
    networks:
      - app-network

networks:
  app-network:
volumes:
  db-data: