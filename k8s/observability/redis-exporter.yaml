apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-exporter-sa
  namespace: cnas
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/part-of: cnas-observability
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: cnas
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/part-of: cnas-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-exporter
        app.kubernetes.io/part-of: cnas-observability
    spec:
      serviceAccountName: redis-exporter-sa
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 59000
        runAsGroup: 59000
        fsGroup: 59000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.84.0
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_ADDR
              value: redis://redis-service:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cnas-secret
                  key: REDIS_PASSWORD
            - name: REDIS_EXPORTER_CONNECTION_TIMEOUT
              value: 5s
            - name: REDIS_EXPORTER_LOG_FORMAT
              value: txt
          ports:
            - name: metrics
              containerPort: 9121
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            runAsUser: 59000
            runAsGroup: 59000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 150m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: cnas
  labels:
    app.kubernetes.io/name: redis-exporter
    app.kubernetes.io/part-of: cnas-observability
spec:
  selector:
    app.kubernetes.io/name: redis-exporter
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-exporter
  namespace: cnas
  labels:
    app.kubernetes.io/part-of: cnas-observability
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-exporter
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-exporter-egress
  namespace: cnas
  labels:
    app.kubernetes.io/part-of: cnas-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-exporter-allow-prometheus
  namespace: cnas
  labels:
    app.kubernetes.io/part-of: cnas-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              cnas.assg/role: prometheus
      ports:
        - protocol: TCP
          port: 9121
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: redis-exporter
  namespace: cnas
  labels:
    app.kubernetes.io/part-of: cnas-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-exporter
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
