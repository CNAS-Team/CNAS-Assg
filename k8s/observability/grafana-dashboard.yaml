          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 13},
          "id": 12,
          "options": {"legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (instance) (rate(kong_http_requests_total{namespace=\"kong\"}[5m]))", "legendFormat": "{{instance}}", "refId": "A"}],
          "title": "Traffic by Kong instance",
