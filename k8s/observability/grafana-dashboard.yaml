    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "mappings": [{"options": {"0": {"color": "red", "text": "DOWN"}, "1": {"color": "green", "text": "UP"}}, "type": "value"}], "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 0, "y": 0},
          "id": 1,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "min(probe_success{service=\"gateway\"}) or vector(0)", "legendFormat": "Gateway", "refId": "A"}],
          "title": "HTTPS route",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 200}, {"color": "red", "value": 400}]}}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 4, "y": 0},
          "id": 2,
          "options": {"colorMode": "background", "graphMode": "none", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "probe_http_status_code{service=\"gateway\"}", "legendFormat": "HTTP", "refId": "A"}],
          "title": "Gateway status code",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "red", "value": 0}, {"color": "yellow", "value": 7}, {"color": "green", "value": 14}]}, "unit": "d"}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 8, "y": 0},
          "id": 3,
          "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "min((probe_ssl_earliest_cert_expiry{service=\"gateway\"} - time()) / 86400)", "legendFormat": "Days", "refId": "A"}],
          "title": "TLS days remaining",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 12, "y": 0},
          "id": 4,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "sum(rate(kong_http_requests_total{namespace=\"kong\"}[5m]))", "legendFormat": "RPS", "refId": "A"}],
          "title": "Request rate",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.01}, {"color": "red", "value": 0.05}]}, "unit": "percentunit"}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 16, "y": 0},
          "id": 5,
          "options": {"colorMode": "background", "graphMode": "area", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "sum(rate(kong_http_requests_total{namespace=\"kong\", code=~\"5..\"}[5m])) / clamp_min(sum(rate(kong_http_requests_total{namespace=\"kong\"}[5m])), 0.001)", "legendFormat": "5xx", "refId": "A"}],
          "title": "HTTP 5xx ratio",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 5, "w": 4, "x": 20, "y": 0},
          "id": 6,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "center", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "sum(rate(kong_http_requests_total{namespace=\"kong\", code=\"429\"}[5m]))", "legendFormat": "429", "refId": "A"}],
          "title": "Rate-limited requests",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 5},
          "id": 7,
          "options": {"legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (code) (rate(kong_http_requests_total{namespace=\"kong\"}[5m]))", "legendFormat": "HTTP {{code}}", "refId": "A"}],
          "title": "Requests by HTTP status",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "ms"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 5},
          "id": 8,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le) (rate(kong_request_latency_ms_bucket{namespace=\"kong\"}[5m])))", "legendFormat": "Request", "refId": "A"}, {"expr": "histogram_quantile(0.95, sum by (le) (rate(kong_kong_latency_ms_bucket{namespace=\"kong\"}[5m])))", "legendFormat": "Kong", "refId": "B"}, {"expr": "histogram_quantile(0.95, sum by (le) (rate(kong_upstream_latency_ms_bucket{namespace=\"kong\"}[5m])))", "legendFormat": "Upstream", "refId": "C"}],
          "title": "p95 latency",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "Bps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 5},
          "id": 9,
          "options": {"legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (direction) (rate(kong_bandwidth_bytes{namespace=\"kong\"}[5m]))", "legendFormat": "{{direction}}", "refId": "A"}],
          "title": "Gateway bandwidth",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 13},
          "id": 10,
          "options": {"legend": {"calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (success) (rate(ingress_controller_configuration_push_count{namespace=\"kong\"}[5m]))", "legendFormat": "success={{success}}", "refId": "A"}, {"expr": "sum by (success) (rate(ingress_controller_translation_count{namespace=\"kong\"}[5m]))", "legendFormat": "translation={{success}}", "refId": "B"}],
          "title": "KIC configuration activity",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "loki", "uid": "loki"},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 13},
          "id": 11,
          "options": {"legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"datasource": {"type": "loki", "uid": "loki"}, "editorMode": "code", "expr": "sum by (pod) (rate({namespace=\"cnas\", container=\"php-app\"} |= \"HTTP/\" != \"/readyz.php\" != \"/livez.php\" [1m]))", "legendFormat": "{{pod}}", "queryType": "range", "refId": "A"}],
          "title": "Backend request distribution by PHP Pod",
          "type": "timeseries"
